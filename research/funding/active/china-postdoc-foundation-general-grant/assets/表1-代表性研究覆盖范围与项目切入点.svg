<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790" viewBox="0 0 1600 790" role="img" aria-labelledby="title desc">
  <title id="title">代表性研究的覆盖范围与本项目切入点</title>
  <desc id="desc">对六篇代表性文献在 PIML 局部表示、全局算子级 Matrix-Free、迭代求解和 GPU 端到端四个环节的覆盖情况进行比较。</desc>
  <style>
    .text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #172b4d; }
    .header { font-size: 27px; font-weight: 600; text-anchor: middle; }
    .body { font-size: 32px; font-weight: 400; }
    .project { font-size: 34px; font-weight: 700; }
    .note { font-size: 24px; fill: #4d5f73; }
    .grid { stroke: #9aabbd; stroke-width: 2.5; }
    .mark { fill: #157347; }
    .dash { font-size: 34px; fill: #6c757d; text-anchor: middle; }
  </style>

  <rect width="1600" height="790" fill="#ffffff"/>

  <!-- Header -->
  <rect x="50" y="40" width="450" height="110" fill="#eaf1f8" class="grid"/>
  <rect x="500" y="40" width="300" height="110" fill="#eaf1f8" class="grid"/>
  <rect x="800" y="40" width="280" height="110" fill="#eaf1f8" class="grid"/>
  <rect x="1080" y="40" width="290" height="110" fill="#eaf1f8" class="grid"/>
  <rect x="1370" y="40" width="180" height="110" fill="#eaf1f8" class="grid"/>

  <text x="275" y="105" class="text header">代表性工作</text>
  <text class="text header"><tspan x="650" y="88">PIML 局部表示</tspan><tspan x="650" y="120">／按需预测</tspan></text>
  <text class="text header"><tspan x="940" y="88">全局算子级</tspan><tspan x="940" y="120">Matrix-Free</tspan></text>
  <text class="text header"><tspan x="1225" y="88">迭代求解／</tspan><tspan x="1225" y="120">多重网格预条件</tspan></text>
  <text class="text header"><tspan x="1460" y="88">GPU</tspan><tspan x="1460" y="120">端到端</tspan></text>

  <!-- Row backgrounds and grid -->
  <g fill="#ffffff" class="grid">
    <rect x="50" y="150" width="450" height="90"/><rect x="500" y="150" width="300" height="90"/><rect x="800" y="150" width="280" height="90"/><rect x="1080" y="150" width="290" height="90"/><rect x="1370" y="150" width="180" height="90"/>
    <rect x="50" y="240" width="450" height="90"/><rect x="500" y="240" width="300" height="90"/><rect x="800" y="240" width="280" height="90"/><rect x="1080" y="240" width="290" height="90"/><rect x="1370" y="240" width="180" height="90"/>
    <rect x="50" y="330" width="450" height="90"/><rect x="500" y="330" width="300" height="90"/><rect x="800" y="330" width="280" height="90"/><rect x="1080" y="330" width="290" height="90"/><rect x="1370" y="330" width="180" height="90"/>
    <rect x="50" y="420" width="450" height="90"/><rect x="500" y="420" width="300" height="90"/><rect x="800" y="420" width="280" height="90"/><rect x="1080" y="420" width="290" height="90"/><rect x="1370" y="420" width="180" height="90"/>
    <rect x="50" y="510" width="450" height="90"/><rect x="500" y="510" width="300" height="90"/><rect x="800" y="510" width="280" height="90"/><rect x="1080" y="510" width="290" height="90"/><rect x="1370" y="510" width="180" height="90"/>
  </g>
  <g fill="#eaf6ed" class="grid">
    <rect x="50" y="600" width="450" height="90"/><rect x="500" y="600" width="300" height="90"/><rect x="800" y="600" width="280" height="90"/><rect x="1080" y="600" width="290" height="90"/><rect x="1370" y="600" width="180" height="90"/>
  </g>

  <!-- Row labels -->
  <text x="75" y="205" class="text body">[1] 通用有限元算子</text>
  <text x="75" y="295" class="text body">[2] GPU 拓扑优化</text>
  <text x="75" y="385" class="text body">[3] Matrix-Free／MGPCG</text>
  <text x="75" y="475" class="text body">[4]–[5] PIML 局部映射</text>
  <text x="75" y="565" class="text body">[6] PIML 按需预测与并行</text>
  <text x="75" y="655" class="text project">本项目切入</text>

  <!-- Empty-cell dashes -->
  <g class="text dash">
    <text x="650" y="205">—</text><text x="1225" y="205">—</text><text x="1460" y="205">—</text>
    <text x="650" y="295">—</text><text x="940" y="295">—</text><text x="1225" y="295">—</text>
    <text x="650" y="385">—</text><text x="1460" y="385">—</text>
    <text x="940" y="475">—</text><text x="1225" y="475">—</text><text x="1460" y="475">—</text>
    <text x="940" y="565">—</text><text x="1460" y="565">—</text>
  </g>

  <!-- Coverage marks -->
  <g class="mark">
    <circle cx="940" cy="195" r="9"/>
    <circle cx="1460" cy="285" r="9"/>
    <circle cx="940" cy="375" r="9"/><circle cx="1225" cy="375" r="9"/>
    <circle cx="650" cy="465" r="9"/>
    <circle cx="650" cy="555" r="9"/><circle cx="1225" cy="555" r="9"/>
    <circle cx="650" cy="645" r="9"/><circle cx="940" cy="645" r="9"/><circle cx="1225" cy="645" r="9"/><circle cx="1460" cy="645" r="9"/>
  </g>

  <text x="50" y="746" class="text note">注：依据本节文献 [1]–[6] 的研究主题整理；“●”表示该工作明确覆盖相应环节。</text>
</svg>
